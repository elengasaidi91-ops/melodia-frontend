<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0A0F">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Melodia Congo</title>
<link rel="icon" href="melodia-icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0A0A0F; --sur:#12121A; --s2:#1A1A26; --s3:#20202E;
  --grn:#1DB954; --g2:#17a349; --g-soft:rgba(29,185,84,.12);
  --red:#EF4444; --gold:#f59e0b; --purple:#7C3AED; --blue:#3b82f6;
  --txt:rgba(255,255,255,.92); --mut:rgba(255,255,255,.45); --mut2:rgba(255,255,255,.65);
  --bdr:rgba(255,255,255,.07);
  --radius:18px; --radius-sm:12px;
}
html,body{height:100%;}
body{
  display:flex;flex-direction:column;min-height:100vh;min-height:-webkit-fill-available;
  background:radial-gradient(ellipse at top,#0f1710 0%,#0A0A0F 55%);
  color:var(--txt);font-family:'Inter','Helvetica Neue',Arial,sans-serif;
  overflow-x:hidden;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{display:none;}
.app{max-width:520px;margin:0 auto;width:100%;display:flex;flex-direction:column;min-height:100vh;position:relative;}
.screen{display:none;flex:1;padding:22px 18px 100px;animation:fadeIn .25s ease;}
.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand svg{width:30px;height:30px;}
.brand-name{font-size:21px;font-weight:800;letter-spacing:-0.3px;}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:17px;position:relative;}
.badge-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--grn);border:2px solid var(--bg);}
.hello{font-size:26px;font-weight:800;margin-bottom:5px;}
.subtext{font-size:13px;color:var(--mut);margin-bottom:22px;}
.search-bar{display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--bdr);border-radius:14px;padding:13px 16px;margin-bottom:22px;}
.search-bar input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:14px;}
.search-bar input::placeholder{color:var(--mut);}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px;}
.sec-title{font-size:16px;font-weight:800;}
.sec-link{font-size:12px;color:var(--grn);font-weight:700;}
.hcards{display:flex;gap:14px;overflow-x:auto;padding-bottom:4px;}
.acard{flex:0 0 auto;width:84px;text-align:center;}
.acard .av{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--s2);margin-bottom:8px;border:2px solid transparent;}
.acard .n{font-size:12px;font-weight:700;}
.acard .d{font-size:10px;color:var(--mut);}
.song-row{display:flex;align-items:center;gap:13px;background:var(--sur);border:1px solid var(--bdr);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:10px;transition:.15s;}
.song-row:active{background:var(--s2);}
.song-row.playing{border-color:var(--grn);background:var(--g-soft);}
.song-row img{width:46px;height:46px;border-radius:9px;object-fit:cover;background:var(--s2);}
.song-info{flex:1;min-width:0;}
.song-title{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.song-sub{font-size:11.5px;color:var(--mut);}
.song-play{width:34px;height:34px;border-radius:50%;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.song-row.playing .song-play{background:var(--grn);color:#000;}
.chip-row{display:flex;gap:9px;overflow-x:auto;margin-bottom:22px;padding-bottom:2px;}
.chip{flex:0 0 auto;padding:9px 18px;border-radius:22px;font-size:12.5px;font-weight:700;background:var(--s2);color:var(--mut2);}
.chip.on{background:var(--grn);color:#000;}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:rgba(10,10,15,.92);backdrop-filter:blur(16px);border-top:1px solid var(--bdr);display:flex;justify-content:space-around;padding:10px 6px calc(10px + env(safe-area-inset-bottom));z-index:50;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--mut);font-weight:600;flex:1;}
.nav-item.on{color:var(--grn);}
.nav-item .ic{font-size:19px;}
.btn{width:100%;background:var(--grn);color:#000;font-size:14.5px;font-weight:800;padding:14px;border-radius:13px;text-align:center;}
.btn:active{background:var(--g2);}
.btn.outline{background:none;border:1.5px solid var(--bdr);color:var(--txt);}
.btn.sm{padding:10px;font-size:13px;}
.btn.danger{background:var(--red);color:#fff;}
.btn[disabled]{opacity:.5;}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);overflow-y:auto;padding:16px 0;}
#ov.hidden{display:none;}
.modal{background:var(--s2);border-radius:20px;padding:26px 24px;width:420px;max-width:92vw;}
.inp{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--bdr);border-radius:10px;padding:12px 14px;color:#fff;font-size:13.5px;outline:none;margin-bottom:10px;transition:.15s;}
.inp:focus{border-color:var(--grn);}
.inp::placeholder{color:var(--mut);}
label.lbl{font-size:11px;font-weight:700;color:var(--mut);margin-bottom:5px;display:block;}
.err{color:#f87171;font-size:12px;margin-bottom:10px;background:rgba(248,113,113,.1);padding:9px 12px;border-radius:8px;display:none;}
.suc{color:var(--grn);font-size:12px;margin-bottom:10px;background:rgba(29,185,84,.1);padding:9px 12px;border-radius:8px;display:none;}
.sw{text-align:center;margin-top:14px;font-size:12.5px;color:var(--mut);}
.sw span{color:var(--grn);cursor:pointer;font-weight:700;}
.type-cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px;}
.type-card{background:rgba(255,255,255,.05);border:2px solid transparent;border-radius:12px;padding:14px 10px;text-align:center;}
.type-card.sel-listener{border-color:var(--grn);background:var(--g-soft);}
.type-card.sel-artist{border-color:var(--gold);background:rgba(245,158,11,.08);}
.tc-icon{font-size:24px;margin-bottom:6px;}
.tc-name{font-size:13px;font-weight:800;}
.tc-desc{font-size:10.5px;color:var(--mut);margin-top:2px;}
.player-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.player-cover{width:100%;aspect-ratio:1;border-radius:22px;background:linear-gradient(135deg,var(--s3),var(--s2));margin-bottom:26px;object-fit:cover;}
.player-title{font-size:21px;font-weight:800;margin-bottom:4px;}
.player-artist{font-size:13.5px;color:var(--mut);margin-bottom:20px;}
.progress{height:4px;background:var(--s3);border-radius:4px;margin-bottom:8px;position:relative;overflow:hidden;}
.progress-fill{height:100%;background:var(--grn);border-radius:4px;}
.time-row{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-bottom:24px;}
.controls{display:flex;align-items:center;justify-content:center;gap:26px;margin-bottom:26px;}
.ctl-play{width:64px;height:64px;border-radius:50%;background:var(--grn);color:#000;display:flex;align-items:center;justify-content:center;font-size:22px;}
.ctl-side{font-size:22px;color:var(--txt);}
.profile-hdr{display:flex;align-items:center;gap:16px;background:var(--sur);border:1px solid var(--bdr);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
.profile-hdr img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--s2);}
.premium-card{background:linear-gradient(120deg,var(--grn),var(--g2));border-radius:var(--radius-sm);padding:15px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;color:#04170a;font-weight:800;}
.list-row{display:flex;align-items:center;justify-content:space-between;background:var(--sur);border:1px solid var(--bdr);border-radius:var(--radius-sm);padding:15px 16px;margin-bottom:9px;font-size:13.5px;font-weight:700;}
.list-row .l{display:flex;align-items:center;gap:11px;}
.list-row .arrow{color:var(--mut);}
.bal-card{background:linear-gradient(120deg,var(--grn),var(--g2));border-radius:var(--radius);padding:20px;margin-bottom:18px;color:#04170a;}
.bal-amt{font-size:28px;font-weight:900;margin:6px 0 10px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.tile{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--radius-sm);padding:16px;text-align:center;font-weight:700;font-size:13px;}
.tile .ic{font-size:20px;margin-bottom:6px;}
.chat-row{display:flex;align-items:center;gap:13px;padding:12px 4px;border-bottom:1px solid var(--bdr);}
.chat-row img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--s2);}
.chat-name{font-size:14px;font-weight:700;}
.chat-msg{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;}
.unread{background:var(--grn);color:#000;font-size:10px;font-weight:800;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;}
.thread{display:flex;flex-direction:column;gap:8px;padding-bottom:70px;}
.bubble{max-width:78%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.4;}
.bubble.mine{align-self:flex-end;background:var(--grn);color:#04170a;border-bottom-right-radius:4px;}
.bubble.theirs{align-self:flex-start;background:var(--s2);border-bottom-left-radius:4px;}
.chat-input-row{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--bdr);}
.chat-input-row input{flex:1;background:var(--s2);border:1px solid var(--bdr);border-radius:24px;padding:12px 16px;color:#fff;outline:none;font-size:13.5px;}
.send-btn{width:44px;height:44px;border-radius:50%;background:var(--grn);color:#000;font-size:16px;flex-shrink:0;}
.plan-row{display:flex;gap:8px;background:var(--s2);border-radius:12px;padding:5px;margin-bottom:18px;}
.plan-opt{flex:1;text-align:center;padding:10px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--mut2);position:relative;}
.plan-opt.on{background:var(--grn);color:#000;}
.discount{position:absolute;top:-8px;right:2px;background:var(--gold);color:#000;font-size:8.5px;font-weight:800;padding:2px 5px;border-radius:5px;}
.price-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--radius);padding:22px;margin-bottom:18px;}
.price-amt{font-size:26px;font-weight:900;margin:4px 0;}
.pay-opt{display:flex;align-items:center;justify-content:space-between;background:var(--sur);border:1.5px solid var(--bdr);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;font-weight:700;font-size:13.5px;}
.pay-opt.sel{border-color:var(--grn);background:var(--g-soft);}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--mut);position:relative;}
.radio.on{border-color:var(--grn);}
.radio.on::after{content:'';position:absolute;inset:3px;background:var(--grn);border-radius:50%;}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0;}
.dopt{background:var(--sur);border:1.5px solid var(--bdr);border-radius:var(--radius-sm);padding:16px;text-align:center;}
.dopt.on{border-color:var(--grn);background:var(--g-soft);}
.dopt .amt{font-size:17px;font-weight:800;}
.dopt .price{font-size:11.5px;color:var(--mut);margin-top:3px;}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--s3);border:1px solid var(--bdr);padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:300;max-width:90%;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.empty{text-align:center;padding:50px 20px;color:var(--mut);}
.empty .ic{font-size:34px;margin-bottom:12px;}
.empty .t{font-weight:700;color:var(--txt);margin-bottom:4px;}
.empty .d{font-size:12.5px;}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px;}
.cat-card{background:var(--s2);border:2px solid transparent;border-radius:12px;padding:14px;text-align:center;font-size:12.5px;font-weight:700;}
.cat-card.on{border-color:var(--grn);background:var(--g-soft);}
.status-pill{font-size:10px;font-weight:800;padding:4px 10px;border-radius:20px;}
.status-en_attente{background:rgba(245,158,11,.15);color:var(--gold);}
.status-en_cours{background:rgba(59,130,246,.15);color:var(--blue);}
.status-resolue{background:var(--g-soft);color:var(--grn);}
.status-pending{background:rgba(245,158,11,.15);color:var(--gold);}
.status-validated{background:var(--g-soft);color:var(--grn);}
.status-rejected{background:rgba(239,68,68,.15);color:var(--red);}
textarea.inp{resize:vertical;min-height:80px;}
.spinner{width:16px;height:16px;border:2px solid rgba(0,0,0,.2);border-top-color:#000;border-radius:50%;display:inline-block;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="app" id="app">
<div id="screens-container"></div>
<div class="bottom-nav" id="bottom-nav">
<button class="nav-item on" data-tab="home" onclick="nav('home')"><span class="ic">🏠</span>Accueil</button>
<button class="nav-item" data-tab="explorer" onclick="nav('explorer')"><span class="ic">🔍</span>Explorer</button>
<button class="nav-item" data-tab="chatlist" onclick="nav('chatlist')"><span class="ic">💬</span>Messages</button>
<button class="nav-item" data-tab="profile" onclick="nav('profile')"><span class="ic">👤</span>Profil</button>
</div>
<div id="toast"></div>
</div>
<div id="ov" class="hidden">
<div class="modal" style="text-align:center;">
<div class="spinner" style="width:26px;height:26px;border-color:rgba(255,255,255,.2);border-top-color:var(--grn);"></div>
</div>
</div>
<script src="config.js"></script>
<script>
(async function(){
  const [p1, p2] = await Promise.all([
    fetch('screens-part1.html').then(r => r.text()),
    fetch('screens-part2.html').then(r => r.text())
  ]);
  document.getElementById('screens-container').innerHTML = p1 + p2;
  await new Promise(function(resolve){
    var s1 = document.createElement('script');
    s1.src = 'app-part1.js';
    s1.onload = resolve;
    document.body.appendChild(s1);
  });
  var s2 = document.createElement('script');
  s2.src = 'app-part2.js';
  document.body.appendChild(s2);
})();
</script>
</body>
</html>
